# XRGame Native (picoXr) build check for the tencentmalos/xrgame-native fork (spec WP0).
# Needs no secrets. APKs are for internal devices only (spec C4), so this job never uploads
# them as artifacts; it only records their SHA-256 in the job summary.
name: picoXr build check

on:
  push:
    branches: [ "malos/main", "feature/malos/**" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'references/**'
      - '.gitmodules'
  pull_request:
    branches: [ "malos/main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'references/**'
      - '.gitmodules'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: picoxr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'tencentmalos/xrgame-native'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      RUST_TOOLCHAIN: '1.98.1'
      CARGO_NDK_VERSION: '4.1.2'
      NDK_VERSION: '27.3.13750724'

    steps:
      # Only the pinned submodules used by the APK are initialized here.
      - name: Check out
        uses: actions/checkout@v4
      - name: Check out source dependencies
        run: |
          git submodule update --init references/JavaSteam
          git submodule update --init --recursive app/src/main/cpp/extras/adrenotools app/src/main/cpp/lsfg-vk-android
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools autoconf automake libtool autopoint intltool libltdl-dev zstd
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      # libgndownload.so is built from source for picoXr with cargo-ndk (spec WP1-2).
      - name: Set up Rust and cargo-ndk
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target aarch64-linux-android
          rustup default "$RUST_TOOLCHAIN"
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
      - name: Install NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;3.22.1" > /dev/null
      - name: Build Android PulseAudio from source
        timeout-minutes: 20
        run: |
          runtime_root="$RUNNER_TEMP/xrgame-native"
          mkdir -p "$runtime_root/toolchains" build/xrgame-runtime
          ln -s "$ANDROID_HOME/ndk/$NDK_VERSION" "$runtime_root/toolchains/android-ndk-r27d"
          XRGAME_BUILD_ROOT="$runtime_root" bash tools/xrgame/build-pulseaudio.sh
          cp -a "$runtime_root/output/pulseaudio" build/xrgame-runtime/
      # The secrets-gradle-plugin (2.0.1) fails configuration when local.properties is missing.
      # Nothing in the build needs its values, so an empty file is enough; no secrets are written.
      - name: Create empty local.properties
        run: touch local.properties
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build JavaSteam from references/JavaSteam
        timeout-minutes: 20
        run: bash tools/build-javasteam.sh
      - name: Assemble picoXr debug
        timeout-minutes: 45
        run: ./gradlew --console=plain :app:assemblePicoXrDebug
      - name: Audit native libraries and assets
        run: python3 tools/audit-apk app/build/outputs/apk/picoXr/debug/app-picoXr-debug.apk --output build/xrgame-apk-audit.json
      # Printed to the log as well, because job summaries are not readable through the API.
      - name: Record APK identity
        run: |
          {
            echo "### picoXr debug APK"
            echo '```'
            echo "commit: ${GITHUB_SHA}"
            sha256sum app/build/outputs/apk/picoXr/debug/*.apk
            cat app/build/outputs/gndownload/picoXrDebug/BUILD_INFO.txt
            unzip -p app/build/outputs/apk/picoXr/debug/*.apk lib/arm64-v8a/libgndownload.so > /tmp/libgndownload.so
            echo "libgndownload.so $(sha256sum < /tmp/libgndownload.so | cut -d' ' -f1)"
            readelf -n /tmp/libgndownload.so | grep 'Build ID'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Unit tests (picoXr)
        timeout-minutes: 45
        run: ./gradlew --console=plain :app:testPicoXrDebugUnitTest
